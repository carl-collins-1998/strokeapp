{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Edit User - Mobile Stroke Unit{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col">
        <h2><i class="fas fa-user-edit me-2"></i>Edit User</h2>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">{{ user_obj.username }}</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="first_name" class="form-label">First Name</label>
                            <input type="text" class="form-control" id="first_name" name="first_name" value="{{ user_obj.first_name }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="last_name" class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="last_name" name="last_name" value="{{ user_obj.last_name }}">
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ user_obj.email }}">
                    </div>
                    
                    <div class="mb-3">
                        <label for="role" class="form-label">Role</label>
                        <select class="form-select" id="role" name="role">
                            <option value="technician" {% if profile and profile.role == 'technician' %}selected{% endif %}>Mobile Stroke Technician</option>
                            <option value="neurologist" {% if profile and profile.role == 'neurologist' %}selected{% endif %}>Remote Neurologist</option>
                            <option value="admin" {% if profile and profile.role == 'admin' %}selected{% endif %}>Administrator</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="phone" class="form-label">Phone Number</label>
                        <input type="text" class="form-control" id="phone" name="phone" value="{% if profile %}{{ profile.phone }}{% endif %}">
                    </div>
                    
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="is_active" name="is_active" {% if user_obj.is_active %}checked{% endif %}>
                        <label class="form-check-label" for="is_active">Active</label>
                    </div>
                    
                    <div class="d-flex justify-content-between mt-4">
                        <a href="{% url 'user_list' %}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
        
        <div class="text-center mt-3">
            <a href="{% url 'admin:auth_user_change' user_obj.id %}" class="btn btn-sm btn-outline-secondary">
                <i class="fas fa-cog me-1"></i>Advanced Settings
            </a>
        </div>
    </div>
</div>
{% endblock %}
